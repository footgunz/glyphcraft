# Runs on every pull request and on pushes to main.
# The "test" and "build" jobs are required status checks for merging PRs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Newer pushes to the same PR supersede older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Type-checks and bundles the single-file app. Private fonts aren't in the
  # repo, so this builds the public version, the same one releases publish.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:public
